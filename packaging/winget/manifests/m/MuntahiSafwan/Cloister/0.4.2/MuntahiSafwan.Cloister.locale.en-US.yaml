ShortDescription: A quiet, lightweight home for WhatsApp, Discord, Gmail and your other messaging apps.
Description: |-
  Cloister keeps WhatsApp, Discord, Gmail, Messenger, Slack, Telegram and other web messaging apps in one
  lightweight window, each with its own private sign in. Veil blurs your chats in one keystroke, focus
  sessions hold notifications until you are ready, and a PIN lock keeps it private when you step away.
  Services you rarely check can be paused or put to sleep to save memory.
