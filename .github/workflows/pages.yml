# Publishes the landing page in site/ to GitHub Pages.
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.

name: Landing page

on:
  push:
    branches: [main]
    paths: ['site/**', 'CHANGELOG.md', 'scripts/build-changelog.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the changelog page from CHANGELOG.md
        run: node scripts/build-changelog.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
