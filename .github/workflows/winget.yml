# Sends every published release to the Windows Package Manager (winget), so
# `winget install MuntahiSafwan.Cloister` always gets the latest version.
#
# Switch it on only after the first version has been accepted into
# microsoft/winget-pkgs by hand (see docs/releasing.md):
#   1. Fork https://github.com/microsoft/winget-pkgs to your account.
#   2. Create a classic personal access token with the public_repo scope and
#      save it as the WINGET_TOKEN secret.
#   3. Set the repository variable WINGET_PUBLISH to true.

name: winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit, for example v0.4.3'
        required: true

jobs:
  publish:
    name: Submit to winget-pkgs
    if: vars.WINGET_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: MuntahiSafwan.Cloister
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
